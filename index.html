   bassist.style.left=`${x}px`;bassist.style.top=`${foot}px`;bassist.style.width=`${width}px`;bassist.style.height=`${height}px`;
   const beat=Math.floor((musicianElapsed+.0311447)/.24994228),index=beat%4;
   bassistSprite.src=bassArt[index].src;
   function puff(px,py,count,white){for(let i=0;i<count;i++)bassParticles.push({x:px,y:py,vx:(Math.random()-.5)*(white?130:45),vy:-(white?30:12)-Math.random()*(white?65:22),age:0,life:white?.65+Math.random()*.35:.25+Math.random()*.22,r:(white?height*.10:height*.018)*(1+Math.random()),white});}
   if(!bassPuffStarted){bassPuffStarted=true;puff(x,foot-height*.43,26,true);}
   if(beat!==bassLastBeat){if(index===0||index===2)footDust(x-width*.33,foot-height*.012,height*1.04);bassLastBeat=beat;}
   if(!menuMusic.paused){bassNoteClock+=dt;while(bassNoteClock>=.26){bassNoteClock-=.26;notes.push({bass:true,x:x+width*.24,y:foot-height*.42,vx:45+Math.random()*55,vy:-25-Math.random()*25,age:0,life:1.5+Math.random()*.6,angle:(Math.random()-.5)*.3,text:Math.random()<.5?'♪':'♫'});}}
   for(const p of bassParticles){p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const r=p.r*(1+p.age);ctx.save();ctx.globalAlpha=Math.max(0,1-p.age/p.life)*(p.white?.7:.82);if(p.light){ctx.fillStyle='#c79862';ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();}else{const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);g.addColorStop(0,p.white?'#fff':'#95623b');g.addColorStop(1,p.white?'#ffffff00':'#95623b00');ctx.fillStyle=g;ctx.fillRect(p.x-r,p.y-r,r*2,r*2);}ctx.restore();}bassParticles=bassParticles.filter(p=>p.age<p.life);
 }
 let musicianStarted=false,musicianElapsed=0,musicianLastAudio=0,noteLast=0,noteClock=0,notes=[],musicianLastRAF=0;
 function musicianPose(t){if(t<4)return {key:`walk-${[6,3,4,3][Math.floor(t/.18)%4]}`,next:null,blend:0};const phase=(t-3.9688553)/.24994228,index=Math.floor(phase)%4,blend=Math.max(0,Math.min(1,((phase-Math.floor(phase))-.76)/.24));return {key:`bob-${index+1}`,next:`bob-${(index+1)%4+1}`,blend:blend*blend*(3-2*blend)};}
 function renderMusician(now){
   if(inGame){musician.hidden=true;notesCanvas.hidden=true;return;}

   if(!menuMusic.paused){let delta=audioTime-musicianLastAudio;if(delta<-.1){notes=notes.filter(n=>n.bass);delta=(Number.isFinite(menuMusic.duration)?menuMusic.duration:0)-musicianLastAudio+audioTime;}musicianElapsed+=Math.max(0,delta);musicianLastAudio=audioTime;}

   const trumpetPlaying=audioTime>=4&&!menuMusic.paused;const pose=musicianElapsed<4?musicianPose(musicianElapsed):trumpetPlaying?musicianPose(audioTime):{key:'bob-1',next:null,blend:0};musicianA.src=musicianArt[pose.key].src;musicianA.style.opacity=String(1-pose.blend);musicianB.style.opacity=String(pose.blend);if(pose.next)musicianB.src=musicianArt[pose.next].src;
   if(trumpetPlaying){noteClock+=dt;while(noteClock-noteLast>=.26){noteLast+=.26;notes.push({x:x+width*.32,y:foot-size*.69,vx:45+Math.random()*55,vy:-25-Math.random()*25,age:0,life:1.5+Math.random()*.6,angle:(Math.random()-.5)*.3,text:Math.random()<.5?'♪':'♫'});}}
   if(notesCanvas.width!==w||notesCanvas.height!==h){notesCanvas.width=w;notesCanvas.height=h;}const ctx=notesCanvas.getContext('2d');ctx.clearRect(0,0,w,h);ctx.fillStyle='#000';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`bold ${Math.max(16,size*.1)}px Georgia,serif`;
   renderGoat(w,h,size,dt);

   for(const n of notes){n.age+=dt;n.x+=n.vx*dt;n.y+=n.vy*dt;n.vy+=85*dt;ctx.save();ctx.translate(n.x,n.y);ctx.rotate(n.angle+n.age*.2);ctx.globalAlpha=Math.min(1,(n.life-n.age)*3);ctx.fillText(n.text,0,0);ctx.restore();}notes=notes.filter(n=>n.age<n.life&&n.y<h);requestAnimationFrame(renderMusician);
 }
 function startMusician(){if(musicianStarted||inGame)return;musicianStarted=true;musicianElapsed=0;musicianLastAudio=menuMusic.currentTime||0;musician.hidden=false;bassist.hidden=false;notesCanvas.hidden=false;requestAnimationFrame(renderMusician);}
