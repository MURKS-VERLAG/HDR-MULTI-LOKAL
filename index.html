<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d6b783">
  <title>Renchtal</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d6b783}[hidden]{display:none!important}
    #intro{position:fixed;inset:0;z-index:2147483000;display:grid;place-content:center;justify-items:center;gap:24px;background-color:#d6b783;background-image:radial-gradient(ellipse at 45% 37%,#f5e2bc99,transparent 68%),radial-gradient(ellipse at center,transparent 35%,#79502638);transition:opacity 450ms ease;}
    #intro.intro-leaving{opacity:0;pointer-events:none}
    #intro-stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(59.25926vh,86vw);aspect-ratio:16/9;border:2px solid #4b351d;border-radius:5px;box-shadow:0 12px 44px #3e230c55,inset 0 0 0 1px #fce9bf88;overflow:hidden;transition:opacity 900ms ease,transform 900ms ease;background:#c8a67155}
    #intro-video{display:block;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 350ms ease}
    .intro-started #intro-video{opacity:1}#intro-stage.intro-video-finished{opacity:0;transform:translate(-50%,-50%) scale(.985);pointer-events:none}
    #intro-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border:2px solid #080808;border-radius:50%;background:#111;color:white;cursor:pointer;box-shadow:0 4px 22px #0005;transition:box-shadow 180ms ease,background 180ms ease}
    #intro-play::after{content:'';position:absolute;left:34px;top:25px;border-left:25px solid #eee;border-top:15px solid transparent;border-bottom:15px solid transparent}#intro-play:hover,#intro-play:focus-visible{background:#000;box-shadow:0 0 24px #fff8,0 4px 22px #0007;outline:2px solid #f8e8bc;outline-offset:4px}
    #intro-controls{position:absolute;left:50%;top:calc(50% + min(16.66667vh,24.1875vw) + 20px);transform:translateX(-50%);height:78px;display:grid;place-items:center}#intro-spinner{width:47px;height:47px;border:4px solid #85c9e84a;border-top-color:#d6f6ff;border-right-color:#66c7f2;border-radius:50%;box-shadow:0 0 17px #7fd7fb77,inset 0 0 12px #90e4ff77;animation:intro-water 1.15s linear infinite}
    @keyframes intro-water{to{transform:rotate(360deg)}}
    #intro-enter{min-width:180px;height:66px;padding:8px 28px;border:2px solid #514938;border-bottom:7px solid #514938;border-radius:10px;background:linear-gradient(#fffaf0,#ddcfb6);color:#17130e;font:bold 19px Georgia,serif;letter-spacing:2px;box-shadow:0 0 23px #e9f9ffb0,0 5px 9px #36230e44;cursor:pointer}#intro-enter:hover,#intro-enter:focus-visible{background:#fff9ec;box-shadow:0 0 30px #c7f1ff;outline:2px solid #81ccea;outline-offset:4px}#intro-enter span{margin-left:18px;font:28px Arial,sans-serif}
    #intro-message{position:absolute;left:50%;top:calc(50% + min(16.66667vh,24.1875vw) + 102px);transform:translateX(-50%);min-height:20px;margin:0;max-width:85vw;text-align:center;color:#302515;font:15px Arial,sans-serif}
    @media(prefers-reduced-motion:reduce){#intro,#intro-stage{transition:none}}
</style>
</head>
<body>
  <section id="intro" aria-label="Renchtal Intro">
    <div id="intro-stage">
      <video id="intro-video" muted playsinline preload="metadata" disablepictureinpicture aria-label="Renchtal Introfilm"><source src="assets/intro/tavern-intro.webm" type="video/webm"></video>
      <button id="intro-play" type="button" aria-label="Intro und Musik starten"></button>
    </div>
    <div id="intro-controls"><div id="intro-spinner" role="status" aria-label="Hauptmenü wird geladen" hidden></div><button id="intro-enter" type="button" hidden>LEER<span aria-hidden="true">␣</span></button></div>
    <p id="intro-message" role="status"></p>
  </section>

  <main id="menu" aria-label="Spielmodus wählen" inert aria-hidden="true">
    <div class="choices">
      <button id="singleplayer" type="button">EINZELSPIELER</button>
      <button id="multiplayer" type="button">MEHRSPIELER (LOKAL)</button>
    </div>
    <p id="status" role="status" hidden></p>
  </main>
  <section id="game" aria-label="Oberkirch" hidden tabindex="-1">
    <div id="world">
      <img id="map" src="assets/maps/oberkirch-12k.webp" alt="Oberkirch mit Marktplatz, Fluss und zwei Brücken" draggable="false" decoding="async">
      <div id="player" aria-label="Spieler"><img id="playerSprite" src="assets/player/stand-down.png" alt="" draggable="false"></div>
    </div>
  </section>
  <script src="intro.js?v=84"></script>
</body>
</html>
